# The Android app's version. Raise VERSION_NAME (MAJOR.MINOR.PATCH) for every APK that changes the
# native app: new permission, icon, Android settings, Capacitor upgrade. Changes to FindIt's screens
# and features don't need one; the app loads them from https://www.shopwithfindit.com.
#
# versionCode is MAJOR*10000 + MINOR*100 + PATCH (1.0.0 -> 10000), so it always goes up.
VERSION_NAME=1.0.3
