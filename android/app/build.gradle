apply plugin: 'com.android.application'

// App version: android/version.properties.
def versionProps = new Properties()
def versionFile = rootProject.file("version.properties")
if (versionFile.exists()) versionFile.withInputStream { versionProps.load(it) }
def finditVersionName = versionProps.getProperty("VERSION_NAME", "1.0.0")
def finditVersionParts = (finditVersionName.tokenize(".") + ["0", "0", "0"]).take(3).collect { (it.replaceAll("[^0-9]", "") ?: "0") as int }
def finditVersionCode = finditVersionParts[0] * 10000 + finditVersionParts[1] * 100 + finditVersionParts[2]

android {
    namespace = "com.shopwithfindit.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shopwithfindit.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode finditVersionCode
        versionName finditVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A fixed debug key, so every test APK, wherever it's built, has the same signature and installs
    // as an update over the previous one. Test builds only: never use this key for the Play Store.
    signingConfigs {
        debug {
            storeFile file("findit-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Play Store upload key. Never in the repo: the release workflow writes it from GitHub
        // secrets into a temporary file and passes its path and passwords in these variables.
        // Google re-signs the app with its own key (Play App Signing); this key only proves the
        // upload came from you, and Google can reset it if it's ever lost.
        if (System.getenv("FINDIT_UPLOAD_KEYSTORE")) {
            release {
                storeFile file(System.getenv("FINDIT_UPLOAD_KEYSTORE"))
                storePassword System.getenv("FINDIT_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("FINDIT_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("FINDIT_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed only with the upload key above; without it a release build stays unsigned
            // and can't be uploaded by mistake (the debug key is never used for release).
            if (signingConfigs.findByName("release")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
